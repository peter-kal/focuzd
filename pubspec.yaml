name: focuzd
description: "Focuzd is a pomodoro app built for Linux, with Flutter using the Yaru theme."
publish_to: "none"

version: 2.0.0

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies: 
  flutter:
    sdk: flutter

  yaru: ^10.2.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  intl: any
  flutter_localizations:
    sdk: flutter
  handy_window: ^0.4.2
  path_provider: ^2.1.3
  path: ^1.9.0
  equatable: ^2.0.5
  desktop_notifications: ^0.6.3
  drift_sqflite: ^2.0.1
  drift: 2.34.3
  drift_flutter: ^0.3.1
  test: any
  path_to_regexp: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  generate: true
